<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Front-Desk QR &amp; ID Check</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px 12px 36px;
      background: #eef2f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      color: #0f172a;
    }
    .container {
      max-width: 450px;
      margin: 0 auto;
    }
    .desk-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 18px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      margin-bottom: 14px;
    }
    .desk-header .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: #94a3b8;
      font-weight: 700;
    }
    .desk-header h1 {
      margin: 4px 0 0;
      font-size: 19px;
      font-weight: 800;
    }
    .panel {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      margin-bottom: 14px;
    }
    .search-row {
      display: flex;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus {
      border-color: #15803d;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 15px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      background: #15803d;
      color: #ffffff;
    }
    .btn-scan {
      width: 100%;
      margin-top: 10px;
      background: #0f172a;
      color: #ffffff;
    }
    .btn-stop {
      width: 100%;
      margin-top: 8px;
      background: #dc2626;
      color: #ffffff;
      display: none;
    }
    #qr-reader {
      width: 100%;
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      border: 1px solid #e2e8f0;
    }
    .card-banner {
      color: #ffffff;
      padding: 20px 22px;
    }
    .card-banner.active {
      background: linear-gradient(135deg, #0f172a 0%, #14532d 100%);
    }
    .card-banner.inactive {
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
    }
    .card-body {
      padding: 20px 22px 16px;
    }
    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge.active {
      background: #dcfce7;
      color: #166534;
    }
    .badge.inactive {
      background: #fee2e2;
      color: #991b1b;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13.5px;
    }
    .row:last-child {
      border-bottom: none;
      padding-bottom: 4px;
    }
    .row .lbl {
      color: #64748b;
      font-weight: 600;
    }
    .row .val {
      color: #0f172a;
      font-weight: 700;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="desk-header">
      <div class="eyebrow">Front-Desk Live Scanner</div>
      <h1>Member Pass Verification</h1>
    </div>

    <div class="panel">
      <div class="search-row">
        <input
          id="queryInput"
          class="search-input"
          type="text"
          placeholder="Enter Reg ID (e.g. 60) or Phone..."
          onkeydown="if(event.key==='Enter'){runSearch();}"
        />
        <button class="btn btn-primary" onclick="runSearch()">Check</button>
      </div>
      <div class="hint">Type Registration ID or Phone number, or start camera QR scan below.</div>

      <button id="startScanBtn" class="btn btn-scan" onclick="startScanner()">📷 Start Camera QR Scanner</button>
      <button id="stopScanBtn" class="btn btn-stop" onclick="stopScanner()">Stop Camera</button>
      <div id="qr-reader"></div>
    </div>

    <div id="result-area"></div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyPQTSb1Gmq8s5um_1cpcQHmq4R6bU5vFVDjMKRyUilPNE1zHLSzMlCE2Vo1cu17NfeoA/exec';
    let html5QrCode = null;
    let isScanning = false;

    function runSearch() {
      const val = document.getElementById('queryInput').value.trim();
      if (!val) return;
      lookupMember(val);
    }

    function lookupMember(rawQuery) {
      const resultArea = document.getElementById('result-area');
      resultArea.innerHTML = '<div class="panel" style="text-align:center;color:#475569;font-size:13.5px;">Checking member status...</div>';

      const cbName = 'gymPassCb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const oldScript = document.getElementById('jsonp-loader');
      if (oldScript) oldScript.remove();

      window[cbName] = function(data) {
        delete window[cbName];
        const s = document.getElementById('jsonp-loader');
        if (s) s.remove();
        renderResult(data);
      };

      const script = document.createElement('script');
      script.id = 'jsonp-loader';
      script.src = WEB_APP_URL + '?format=json&q=' + encodeURIComponent(rawQuery) + '&callback=' + encodeURIComponent(cbName);
      script.onerror = function() {
        delete window[cbName];
        resultArea.innerHTML = '<div class="panel" style="color:#991b1b;font-size:13.5px;">Network error while connecting to verification service.</div>';
      };
      document.body.appendChild(script);
    }

    function renderResult(info) {
      const area = document.getElementById('result-area');
      if (!info || !info.found) {
        const msg = (info && info.message) ? info.message : 'Member not found.';
        area.innerHTML = `
          <div class="card">
            <div class="card-banner inactive">
              <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#fecaca;font-weight:700;">Verification Failed</div>
              <div style="font-size:20px;font-weight:800;margin-top:4px;">ACCESS DENIED</div>
            </div>
            <div class="card-body" style="text-align:center;">
              <span class="badge inactive">${escapeHtml((info && info.statusLabel) || 'NOT FOUND')}</span>
              <p style="margin:14px 0 0;color:#334155;font-size:14px;">${escapeHtml(msg)}</p>
            </div>
          </div>
        `;
        return;
      }

      const active = !!info.isActive;
      const m = info.matched || {};
      const bannerClass = active ? 'active' : 'inactive';
      const badgeClass = active ? 'active' : 'inactive';
      const titleText = active ? 'GYM DIGITAL PASS' : 'ACCESS DENIED';
      const subText = active ? 'Front-Desk Live Verification' : 'Membership Inactive / Expired';

      area.innerHTML = `
        <div class="card">
          <div class="card-banner ${bannerClass}">
            <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#e2e8f0;font-weight:700;">${subText}</div>
            <div style="font-size:20px;font-weight:800;margin-top:4px;">${titleText}</div>
          </div>
          <div class="card-body">
            <div style="margin-bottom:12px;">
              <span class="badge ${badgeClass}">${escapeHtml(info.statusLabel || (active ? 'ACTIVE MEMBER' : 'INACTIVE'))}</span>
            </div>
            <div class="row"><span class="lbl">Member Name</span><span class="val">${escapeHtml(m.name || '-')}</span></div>
            <div class="row"><span class="lbl">Registration ID</span><span class="val">#${escapeHtml(m.regId || '-')}</span></div>
            <div class="row"><span class="lbl">Phone</span><span class="val">${escapeHtml(m.phone || '-')}</span></div>
            <div class="row"><span class="lbl">Membership Plan</span><span class="val">${escapeHtml(m.plan || '-')}</span></div>
            <div class="row"><span class="lbl">Training Slot</span><span class="val">${escapeHtml(m.slot || '-')}</span></div>
            <div class="row"><span class="lbl">Validity Period</span><span class="val">${escapeHtml(m.startDate || '-')} &rarr; ${escapeHtml(m.expiryDate || '-')}</span></div>
            <div class="row"><span class="lbl">Payment Status</span><span class="val" style="color:${active ? '#166534' : '#991b1b'};">${escapeHtml(m.status || '-')}</span></div>
          </div>
        </div>
      `;
    }

    function startScanner() {
      if (isScanning) return;
      document.getElementById('qr-reader').style.display = 'block';
      document.getElementById('startScanBtn').style.display = 'none';
      document.getElementById('stopScanBtn').style.display = 'block';

      html5QrCode = new Html5Qrcode('qr-reader');
      isScanning = true;

      html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        function(decodedText) {
          stopScanner();
          document.getElementById('queryInput').value = decodedText;
          lookupMember(decodedText);
        },
        function() {}
      ).catch(function(err) {
        isScanning = false;
        document.getElementById('qr-reader').style.display = 'none';
        document.getElementById('startScanBtn').style.display = 'block';
        document.getElementById('stopScanBtn').style.display = 'none';
        alert('Camera error: ' + err);
      });
    }

    function stopScanner() {
      if (!html5QrCode || !isScanning) return;
      html5QrCode.stop().then(function() {
        html5QrCode.clear();
        isScanning = false;
        document.getElementById('qr-reader').style.display = 'none';
        document.getElementById('startScanBtn').style.display = 'block';
        document.getElementById('stopScanBtn').style.display = 'none';
      }).catch(function() {
        isScanning = false;
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
